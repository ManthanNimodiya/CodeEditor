<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Rounded Squircle Backplate -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="#13131a" stroke="url(#glowGrad)" stroke-width="3" />
  
  <!-- Left Angle Bracket -->
  <path d="M 38 32 L 24 50 L 38 68" stroke="url(#glowGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon)" />
  
  <!-- Center Slash / Core -->
  <path d="M 58 30 L 42 70" stroke="#06b6d4" stroke-width="5" stroke-linecap="round" filter="url(#neon)" />
  
  <!-- Right Angle Bracket -->
  <path d="M 62 32 L 76 50 L 62 68" stroke="url(#glowGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon)" />
  
  <!-- Pulse Dot -->
  <circle cx="50" cy="50" r="3" fill="#a78bfa" />
</svg>
